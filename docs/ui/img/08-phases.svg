<svg xmlns="http://www.w3.org/2000/svg" width="940" height="410" viewBox="0 0 940 410" role="img" aria-label="實作順序">
<title>實作順序</title>
<defs><marker id="arw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9a9ab2"/></marker><pattern id="dead" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6a6a80" stroke-width="2" opacity="0.35"/></pattern><pattern id="cell9" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M9,0 L0,0 L0,9" fill="none" stroke="#1e1e2c" stroke-width="0.5"/></pattern><pattern id="hatch" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="#000"/><rect x="1" y="1" width="1" height="1" fill="#000"/></pattern></defs>
<rect width="940" height="410" fill="#0d0d14"/>
<text x="30" y="34" fill="#e8e8f0" font-size="15" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start" font-weight="600">實作順序</text>
<text x="30" y="54" fill="#9a9ab2" font-size="11" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">先把「玩家看不到該看的」補回來，再處理「看得到但看起來不對」，最後才動互動方式。</text>
<text x="30" y="72" fill="#55ff55" font-size="11" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">字型那一項已完成，而且因為格寬沒變，後面的版面重排不必等它。</text>
<rect x="30" y="96" width="30" height="30" fill="none" stroke="#6a6a80" stroke-width="1" rx="4"/>
<text x="45" y="116" fill="#6a6a80" font-size="13" font-family="ui-monospace,'DejaVu Sans Mono',monospace" text-anchor="middle" font-weight="600">0</text>
<text x="74" y="110" fill="#e8e8f0" font-size="12" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">截圖流程固定</text>
<text x="74" y="124" fill="#9a9ab2" font-size="10" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">版面錯誤測試看不到</text>
<text x="910" y="116" fill="#6a6a80" font-size="10.5" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="end">風險 低</text>
<line x1="45" y1="126" x2="45" y2="136" stroke="#3c3c4e" stroke-width="1"/>
<rect x="30" y="136" width="30" height="30" fill="none" stroke="#55ff55" stroke-width="1" rx="4"/>
<text x="45" y="156" fill="#55ff55" font-size="13" font-family="ui-monospace,'DejaVu Sans Mono',monospace" text-anchor="middle" font-weight="600">1</text>
<text x="74" y="150" fill="#e8e8f0" font-size="12" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">偵錯欄下架＋抬頭列＋常駐隊伍表</text>
<text x="74" y="164" fill="#9a9ab2" font-size="10" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">拿回最重要的資訊</text>
<text x="910" y="156" fill="#55ff55" font-size="10.5" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="end">風險 低</text>
<line x1="45" y1="166" x2="45" y2="176" stroke="#3c3c4e" stroke-width="1"/>
<rect x="30" y="176" width="30" height="30" fill="none" stroke="#ffff55" stroke-width="1" rx="4"/>
<text x="45" y="196" fill="#ffff55" font-size="13" font-family="ui-monospace,'DejaVu Sans Mono',monospace" text-anchor="middle" font-weight="600">2</text>
<text x="74" y="190" fill="#e8e8f0" font-size="12" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">面板外框＋拿掉戰場格線＋配色分工</text>
<text x="74" y="204" fill="#9a9ab2" font-size="10" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">視野邊界讀得出來</text>
<text x="910" y="196" fill="#ffff55" font-size="10.5" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="end">風險 中</text>
<line x1="45" y1="206" x2="45" y2="216" stroke="#3c3c4e" stroke-width="1"/>
<rect x="30" y="216" width="30" height="30" fill="none" stroke="#ffaa55" stroke-width="1" rx="4"/>
<text x="45" y="236" fill="#ffaa55" font-size="13" font-family="ui-monospace,'DejaVu Sans Mono',monospace" text-anchor="middle" font-weight="600">3</text>
<text x="74" y="230" fill="#e8e8f0" font-size="12" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">版面常數重排＋訊息移到地圖框下</text>
<text x="74" y="244" fill="#9a9ab2" font-size="10" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">填滿下緣的 35%</text>
<text x="910" y="236" fill="#ffaa55" font-size="10.5" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="end">風險 中高</text>
<line x1="45" y1="246" x2="45" y2="256" stroke="#3c3c4e" stroke-width="1"/>
<rect x="30" y="256" width="30" height="30" fill="none" stroke="#ffff55" stroke-width="1" rx="4"/>
<text x="45" y="276" fill="#ffff55" font-size="13" font-family="ui-monospace,'DejaVu Sans Mono',monospace" text-anchor="middle" font-weight="600">4</text>
<text x="74" y="270" fill="#e8e8f0" font-size="12" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">紅底選單元件取代鍵位提示</text>
<text x="74" y="284" fill="#9a9ab2" font-size="10" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">四個畫面共用一支</text>
<text x="910" y="276" fill="#ffff55" font-size="10.5" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="end">風險 中</text>
<line x1="45" y1="286" x2="45" y2="296" stroke="#3c3c4e" stroke-width="1"/>
<rect x="30" y="296" width="30" height="30" fill="none" stroke="#ffff55" stroke-width="1" rx="4"/>
<text x="45" y="316" fill="#ffff55" font-size="13" font-family="ui-monospace,'DejaVu Sans Mono',monospace" text-anchor="middle" font-weight="600">5</text>
<text x="74" y="310" fill="#e8e8f0" font-size="12" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">城鎮重用地圖視窗＋行距＋標點壓縮</text>
<text x="74" y="324" fill="#9a9ab2" font-size="10" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">中文排版細節</text>
<text x="910" y="316" fill="#ffff55" font-size="10.5" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="end">風險 中</text>
<line x1="45" y1="326" x2="45" y2="336" stroke="#3c3c4e" stroke-width="1"/>
<rect x="30" y="336" width="30" height="30" fill="none" stroke="#9a9ab2" stroke-width="1" rx="4"/>
<text x="45" y="356" fill="#9a9ab2" font-size="13" font-family="ui-monospace,'DejaVu Sans Mono',monospace" text-anchor="middle" font-weight="600">6</text>
<text x="74" y="350" fill="#e8e8f0" font-size="12" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">戰場單位改圖塊＋GOT.FNE 落點</text>
<text x="74" y="364" fill="#9a9ab2" font-size="10" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">敵人圖塊索引未查</text>
<text x="910" y="356" fill="#9a9ab2" font-size="10.5" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="end">風險 中</text>
</svg>
