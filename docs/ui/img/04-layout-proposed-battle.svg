<text x="530" y="291" fill="#000" font-size="9.5" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">閃　避</text>
<rect x="520" y="311" width="160" height="1" fill="#000"/>
<text x="530" y="307" fill="#000" font-size="9.5" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">移　動</text>
