<text x="674" y="68" fill="#e8e8f0" font-size="10" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="end">13時 17日 紅玉月</text>
<rect x="48" y="72" width="296" height="260" fill="none" stroke="#ffffff" stroke-width="1"/>
<rect x="52" y="76" width="288" height="252" fill="#05050a" stroke="#ffffff" stroke-width="1"/>
