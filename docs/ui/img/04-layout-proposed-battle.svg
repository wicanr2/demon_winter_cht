<text x="366" y="111" fill="#e8e8f0" font-size="9.5" font-family="ui-monospace,'DejaVu Sans Mono',monospace" text-anchor="start"> 2 Wopple    24/24  </text>
<text x="366" y="123" fill="#e8e8f0" font-size="9.5" font-family="ui-monospace,'DejaVu Sans Mono',monospace" text-anchor="start"> 3 Podgom    25/25  </text>
