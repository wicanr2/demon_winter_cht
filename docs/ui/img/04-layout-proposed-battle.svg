<text x="530" y="323" fill="#000" font-size="9.5" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">檢　視</text>
<rect x="520" y="343" width="160" height="1" fill="#000"/>
<text x="530" y="339" fill="#000" font-size="9.5" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">音效開關</text>
<rect x="520" y="359" width="160" height="1" fill="#000"/>
<text x="530" y="355" fill="#000" font-size="9.5" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">結束回合</text>
<rect x="520" y="368" width="160" height="56" fill="#181822" stroke="#3c3c4e" stroke-width="1"/>
<text x="530" y="386" fill="#ffff55" font-size="10" font-family="ui-monospace,'DejaVu Sans Mono',monospace" text-anchor="start">Stumpy</text>
<text x="530" y="402" fill="#9a9ab2" font-size="9.5" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">行動點 10　面向 ↓</text>
<line x1="676" y1="116" x2="694" y2="96" stroke="#9a9ab2" stroke-width="0.7" marker-end="url(#arw)"/>
<text x="700" y="100" fill="#55ff55" font-size="10" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">敵我分色</text>
<text x="700" y="113" fill="#9a9ab2" font-size="10" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">不再是同一串白字</text>
<line x1="676" y1="264" x2="694" y2="176" stroke="#9a9ab2" stroke-width="0.7" marker-end="url(#arw)"/>
<text x="700" y="180" fill="#ffaa55" font-size="10" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">同一支選單元件</text>
<text x="700" y="193" fill="#9a9ab2" font-size="10" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">法力不足的項目蓋網點</text>
<text x="700" y="206" fill="#9a9ab2" font-size="10" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">（戰鬥那邊本來就有這個概念，</text>
<text x="700" y="219" fill="#9a9ab2" font-size="10" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">只是換成括號寫法）</text>
<line x1="676" y1="396" x2="694" y2="286" stroke="#9a9ab2" stroke-width="0.7" marker-end="url(#arw)"/>
<text x="700" y="290" fill="#ffaa55" font-size="10" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">目前行動者／行動點／面向</text>
<text x="700" y="303" fill="#9a9ab2" font-size="10" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">原版這一塊在 x≈400, y≈280</text>
<rect x="48" y="344" width="296" height="104" fill="#181822" stroke="#3c3c4e" stroke-width="1"/>
<text x="56" y="362" fill="#e8e8f0" font-size="9.5" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">Stumpy 用匕首攻擊獸人，沒有命中。</text>
<text x="56" y="378" fill="#e8e8f0" font-size="9.5" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">獸人往東移動一格。</text>
<text x="56" y="400" fill="#6a6a80" font-size="9" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">296×104 @ (8,288)　與世界地圖同一個位置</text>
<text x="40" y="476" fill="#9a9ab2" font-size="10" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">抬頭已經有「第 N 回合」，戰鬥紀錄不要再輸出一次（目前重複兩處）。</text>
</svg>
