<text x="196" y="198" fill="#ffaa55" font-size="9" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="middle">無格線 —— 原版沒有，而它是全畫面最密的線條</text>
<text x="196" y="213" fill="#ffaa55" font-size="9" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="middle">單位改用 DEMON.SHE 的人形圖塊，不用文字</text>
<text x="196" y="228" fill="#ffff55" font-size="9" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="middle">黃框＝目前行動者　綠框＝我方其餘</text>
<text x="196" y="243" fill="#55ffff" font-size="9" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="middle">白框＝檢視游標　淺紅框＝法術範圍</text>
<rect x="360" y="72" width="320" height="96" fill="#181822" stroke="#3c3c4e" stroke-width="1"/>
