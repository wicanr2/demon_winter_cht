<text x="672" y="195" fill="#000" font-size="8.5" font-family="ui-monospace,'DejaVu Sans Mono',monospace" text-anchor="end">[A]</text>
<rect x="520" y="215" width="160" height="1" fill="#000"/>
<text x="530" y="211" fill="#000" font-size="9.5" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">施　法</text>
